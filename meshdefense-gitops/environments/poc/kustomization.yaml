apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: bigbang

resources:
  - ../../base
  - values-patch.yaml
  - secrets/local-registry-secret.yaml

patches:
  - target:
      kind: HelmRelease
      name: bigbang
    patch: |-
      - op: add
        path: /spec/valuesFrom/-
        value:
          kind: ConfigMap
          name: bigbang-poc-values
          valuesKey: "values.yaml"
