apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: bigbang

resources:
  - ../../base
  - values-patch.yaml
  - secrets/local-registry-secret.yaml
  - secrets/local-git-secret.yaml

patches:
  - target:
      kind: HelmRelease
      name: bigbang
    patch: |-
      - op: add
        path: /spec/valuesFrom/-
        value:
          kind: ConfigMap
          name: bigbang-poc-values
          valuesKey: "values.yaml"
  - target:
      kind: GitRepository
      name: bigbang-repo
    patch: |-
      - op: replace
        path: /spec/url
        value: "https://repo1.dso.mil/big-bang/bigbang.git"
      - op: replace
        path: /spec/ref
        value:
          tag: "3.30.0"
      - op: remove
        path: /spec/secretRef
