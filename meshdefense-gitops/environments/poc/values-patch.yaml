apiVersion: v1
kind: ConfigMap
metadata:
  name: bigbang-poc-values
  namespace: bigbang
data:
  values.yaml: |
    # ==========================================================================
    # MeshDefense POC: Cost-Effective / Local Resource Profiles
    # Scaled down to run on a laptop (KinD) or small single-node VM (t3.2xlarge)
    # ==========================================================================

    domain: "127.0.0.1.nip.io"

    registryCredentials:
      - registry: "localhost:5001"
        username: "poc-user"

    imagePullSecrets:
      - name: "harbor-registry-secret"

    istio:
      enabled: true
      values:
        pilot:
          autoscaleEnabled: false
          replicaCount: 1
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
        meshConfig:
          enableAutoMtls: true
          outboundTrafficPolicy:
            mode: ALLOW_ANY # Relaxed for local POC ease of use

    gatekeeper:
      enabled: true
      values:
        replicas: 1
        controllerManager:
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"

    monitoring:
      enabled: true
      values:
        prometheus:
          prometheusSpec:
            replicas: 1
            retention: "24h"
            resources:
              requests:
                cpu: "200m"
                memory: "512Mi"
              limits:
                cpu: "500m"
                memory: "1Gi"
        grafana:
          replicas: 1
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
        alertmanager:
          alertmanagerSpec:
            replicas: 1

    neuvector:
      enabled: false # Disabled by default in local POC to save RAM

    fluentbit:
      enabled: false # Disabled by default in local POC to save RAM

    addons:
      argocd:
        enabled: true
        values:
          server:
            replicas: 1
            insecure: true
            resources:
              requests:
                cpu: "100m"
                memory: "256Mi"
          repoServer:
            replicas: 1
            resources:
              requests:
                cpu: "100m"
                memory: "256Mi"
          redis:
            resources:
              requests:
                cpu: "50m"
                memory: "128Mi"
      sonarqube:
        enabled: false
      gitlab:
        enabled: false
      vault:
        enabled: false
      keycloak:
        enabled: false

    networkPolicies:
      enabled: false # Relaxed for local KinD troubleshooting
