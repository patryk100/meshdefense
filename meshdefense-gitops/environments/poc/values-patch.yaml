apiVersion: v1
kind: ConfigMap
metadata:
  name: bigbang-poc-values
  namespace: bigbang
data:
  values.yaml: |
    # ==========================================================================
    # MeshDefense POC: Cost-Effective / Local Resource Profiles (Big Bang 3.30.0)
    # Scaled down to run on a laptop (KinD) or small single-node VM (t3.2xlarge)
    # ==========================================================================

    domain: "127.0.0.1.nip.io"

    registryCredentials:
      - registry: "registry1.dso.mil"
        username: "REDACTED_USERNAME"
        password: "REDACTED_PASSWORD"
        email: "user@meshdefense.local"

    istioCRDs:
      enabled: true

    istiod:
      enabled: true
      values:
        upstream:
          autoscaleEnabled: false
          replicaCount: 1
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

    istioGateway:
      enabled: true

    gatekeeper:
      enabled: false

    monitoring:
      enabled: true
      values:
        prometheus:
          prometheusSpec:
            replicas: 1
            retention: "24h"
            resources:
              requests:
                cpu: "200m"
                memory: "512Mi"
              limits:
                cpu: "500m"
                memory: "1Gi"
        grafana:
          replicas: 1
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
        alertmanager:
          alertmanagerSpec:
            replicas: 1

    neuvector:
      enabled: false # Disabled by default in local POC to save RAM

    fluentbit:
      enabled: false # Disabled by default in local POC to save RAM

    kyverno:
      enabled: true
      values:
        upstream:
          admissionController:
            replicas: 1
          backgroundController:
            replicas: 1
          cleanupController:
            replicas: 1
          reportsController:
            replicas: 1

    kyvernoPolicies:
      enabled: true

    kyvernoReporter:
      enabled: false

    loki:
      enabled: false

    tempo:
      enabled: false

    alloy:
      enabled: false

    bbctl:
      enabled: false

    kiali:
      enabled: false

    addons:
      argocd:
        enabled: true
        values:
          server:
            replicas: 1
            insecure: true
            resources:
              requests:
                cpu: "100m"
                memory: "256Mi"
          repoServer:
            replicas: 1
            resources:
              requests:
                cpu: "100m"
                memory: "256Mi"
          redis:
            resources:
              requests:
                cpu: "50m"
                memory: "128Mi"
      sonarqube:
        enabled: false
      gitlab:
        enabled: false
      vault:
        enabled: false
      keycloak:
        enabled: false
      metricsServer:
        enabled: false

    networkPolicies:
      enabled: false # Relaxed for local KinD troubleshooting
