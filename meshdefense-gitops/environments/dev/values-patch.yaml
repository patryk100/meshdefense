apiVersion: v1
kind: ConfigMap
metadata:
  name: bigbang-dev-values
  namespace: bigbang
data:
  values.yaml: |
    # Dev Environment Specific Overrides
    domain: "dev.il6.meshdefense.internal"

    monitoring:
      values:
        prometheus:
          prometheusSpec:
            replicas: 1
            retention: "7d"
            resources:
              requests:
                cpu: "500m"
                memory: "2Gi"
        grafana:
          replicas: 1

    neuvector:
      values:
        controller:
          replicas: 1

    addons:
      argocd:
        enabled: true
      sonarqube:
        enabled: true
      gitlab:
        enabled: false
      vault:
        enabled: false
      keycloak:
        enabled: false
