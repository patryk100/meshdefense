apiVersion: v1
kind: ConfigMap
metadata:
  name: bigbang-stg-values
  namespace: bigbang
data:
  values.yaml: |
    # Staging Environment Specific Overrides (Production Parity)
    domain: "stg.il6.meshdefense.internal"

    monitoring:
      values:
        prometheus:
          prometheusSpec:
            replicas: 2
            retention: "30d"
        grafana:
          replicas: 2

    neuvector:
      values:
        controller:
          replicas: 3

    addons:
      gitlab:
        enabled: true
      sonarqube:
        enabled: true
      keycloak:
        enabled: true
      vault:
        enabled: true
