# --------------------------------------------------------------------------------------------------
# MeshDefense Tenant Microsegmentation NetworkPolicy: tenant-telemetry
# Default-Deny-All with explicit least privilege Ingress and Egress (NIST 800-53 SC-7)
# --------------------------------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: telemetry-analytics-isolation-policy
  namespace: tenant-telemetry
  labels:
    meshdefense.io/tenant: "telemetry-analytics"
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Intra-namespace ingress
    - from:
        - podSelector: {}
    # Ingress from Istio Ingress Gateway
    - from:
        - namespaceSelector:
            matchLabels:
              istio.io/deploystatus: "gateway"
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
    # Ingress from Monitoring / Prometheus scraper
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 9090
  egress:
    # DNS resolution
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Intra-namespace pod-to-pod
    - to:
        - podSelector: {}
    # Internal VPC endpoints and platform services
    - to:
        - ipBlock:
            cidr: 10.104.0.0/16
    # Egress: egress-internal-rds-postgres
    - ports:
        - protocol: TCP
          port: 5432
    # Egress: egress-external-s3-endpoints
    - ports:
        - protocol: HTTPS
          port: 443
