apiVersion: v1
kind: ConfigMap
metadata:
  name: bigbang-core-values
  namespace: bigbang
data:
  values.yaml: |
    # Baseline Big Bang Air-Gap Values (Big Bang 3.30.0 Compliant)
    domain: "il6.meshdefense.internal"

    registryCredentials:
      - registry: "registry.il6.meshdefense.internal"
        username: "airgap-robot"
        password: "placeholder-password"
        email: "devsecops@meshdefense.internal"

    istioCRDs:
      enabled: true

    istiod:
      enabled: true

    istioGateway:
      enabled: true

    gatekeeper:
      enabled: true

    monitoring:
      enabled: true

    neuvector:
      enabled: true

    fluentbit:
      enabled: true

    addons:
      argocd:
        enabled: false

    networkPolicies:
      enabled: true
