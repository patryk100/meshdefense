apiVersion: v1
kind: Namespace
metadata:
  name: minio
  labels:
    meshdefense.io/tier: storage
---
apiVersion: v1
kind: Secret
metadata:
  name: minio-creds
  namespace: minio
type: Opaque
stringData:
  rootUser: "minioadmin"
  rootPassword: "MinioAdminPassword123!"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: minio
  labels:
    app: minio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: minio
          image: quay.io/minio/minio:latest
          command:
            - minio
            - server
            - /data
            - --console-address
            - ":9001"
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-creds
                  key: rootUser
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-creds
                  key: rootPassword
            - name: MINIO_KMS_SECRET_KEY
              value: "harbor-storage:c2VjcmV0LWtlZXktZm9yLWVuY3J5cHRpb24xMjM0NTY="
          ports:
            - containerPort: 9000
              name: s3
            - containerPort: 9001
              name: console
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: storage
              mountPath: /data
      volumes:
        - name: storage
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: minio
spec:
  ports:
    - name: s3
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
  selector:
    app: minio
---
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-init-harbor-bucket
  namespace: minio
spec:
  ttlSecondsAfterFinished: 120
  backoffLimit: 10
  template:
    metadata:
      labels:
        app: minio-init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: quay.io/minio/mc:latest
          command:
            - /bin/sh
            - -c
            - |
              echo "[*] Waiting for MinIO service..."
              until mc alias set local http://minio.minio.svc.cluster.local:9000 minioadmin MinioAdminPassword123!; do
                echo "Retrying MinIO connection..."
                sleep 2
              done
              echo "[*] Creating S3 bucket 'harbor-registry'..."
              mc mb --ignore-existing local/harbor-registry
              echo "[*] Enabling SSE-S3 encrypted persistence on 'harbor-registry'..."
              mc encrypt set sse-s3 local/harbor-registry
              echo "[+] MinIO S3 bucket 'harbor-registry' successfully provisioned with SSE-S3 encryption."
