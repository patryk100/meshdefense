# --------------------------------------------------------------------------------------------------
# 1. Harbor Container & Helm Registry VirtualService
# --------------------------------------------------------------------------------------------------
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: harbor-vs
  namespace: istio-system
spec:
  hosts:
    - "harbor.apps.poc-minimal.il6.meshdefense.internal"
    - "harbor.apps.dev.il6.meshdefense.internal"
    - "harbor.apps.test.il6.meshdefense.internal"
    - "harbor.apps.stg.il6.meshdefense.internal"
    - "harbor.apps.prod.il6.meshdefense.internal"
  gateways:
    - meshdefense-internal-gateway
  http:
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: harbor-core.harbor.svc.cluster.local
            port:
              number: 80
---
