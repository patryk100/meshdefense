# ==============================================================================
# Istio VirtualService & Ingress for Monitoring Stack (Story 5.3)
# Exposes Grafana via Istio Ingress Gateway with strict mTLS & TLS termination
# ==============================================================================
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: monitoring
spec:
  hosts:
    - "grafana.apps.poc-cloud-minimal.meshdefense.internal"
    - "grafana.apps.meshdefense.internal"
  gateways:
    - istio-ingress/istio-ingressgateway
    - istio-system/public-ingressgateway
    - mesh
  http:
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: grafana.monitoring.svc.cluster.local
            port:
              number: 3000
---
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: monitoring-strict-mtls
  namespace: monitoring
spec:
  mtls:
    mode: STRICT
