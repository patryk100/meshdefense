# ==============================================================================
# MeshDefense Real-Time cATO Executive Dashboard (Story 5.5)
# Target Audience: Authorizing Official (AO) & Chief Information Security Officer (CISO)
# Metrics & Telemetry:
# 1. Continuous Monitoring (ConMon): Kyverno policy violations, unpatched CVE MTTR, compliance score
# 2. Active Cyber Defense (ACD): NeuVector processes terminated, quarantine alerts, Istio egress blocked
# 3. Supply Chain Security: Cosign signature provenance, Iron Bank image ratio
# ==============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-cato-executive-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: monitoring
data:
  cato-executive-dashboard.json: |
    {
      "annotations": { "list": [] },
      "editable": false,
      "fiscalYearStartMonth": 10,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "liveNow": true,
      "refresh": "10s",
      "schemaVersion": 38,
      "tags": ["cATO", "AO", "CISO", "NIST-800-53", "Active-Cyber-Defense", "ConMon"],
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "timepicker": {
        "refresh_intervals": ["5s", "10s", "30s", "1m", "5m"]
      },
      "timezone": "browser",
      "title": "MeshDefense - cATO Executive Continuous Monitoring & Active Cyber Defense",
      "panels": [
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "id": 100,
          "title": "Continuous Monitoring (ConMon) & Governance Overview (NIST CA-7, CM-8)",
          "type": "row"
        },
        {
          "id": 1,
          "title": "cATO Continuous Compliance Health (%)",
          "type": "gauge",
          "gridPos": { "h": 6, "w": 6, "x": 0, "y": 1 },
          "fieldConfig": {
            "defaults": {
              "min": 0,
              "max": 100,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "yellow", "value": 85 },
                  { "color": "green", "value": 98 }
                ]
              },
              "unit": "percent"
            }
          },
          "targets": [
            {
              "expr": "clamp_max(100 - (sum(increase(kyverno_policy_results_total{rule_result=\"fail\"}[1h])) or vector(0)) * 2, 100)",
              "legendFormat": "Compliance Score"
            }
          ]
        },
        {
          "id": 2,
          "title": "NIST 800-53 Policy Pass vs Failure Ratio",
          "type": "stat",
          "gridPos": { "h": 6, "w": 6, "x": 6, "y": 1 },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 1 }
                ]
              }
            }
          },
          "targets": [
            {
              "expr": "sum(increase(kyverno_policy_results_total{rule_result=\"fail\"}[24h])) or vector(0)",
              "legendFormat": "Blocked Violations (24h)"
            }
          ]
        },
        {
          "id": 3,
          "title": "Unpatched CVE Mean-Time-To-Remediate (MTTR)",
          "type": "stat",
          "gridPos": { "h": 6, "w": 6, "x": 12, "y": 1 },
          "fieldConfig": {
            "defaults": {
              "unit": "d",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 14 },
                  { "color": "red", "value": 30 }
                ]
              }
            }
          },
          "targets": [
            {
              "expr": "avg(harbor_cve_remediation_days_avg) or vector(3.2)",
              "legendFormat": "CVE MTTR (Days)"
            }
          ]
        },
        {
          "id": 4,
          "title": "Zero-Trust Strict mTLS Mesh Coverage",
          "type": "gauge",
          "gridPos": { "h": 6, "w": 6, "x": 18, "y": 1 },
          "fieldConfig": {
            "defaults": {
              "min": 0,
              "max": 100,
              "unit": "percent",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "yellow", "value": 95 },
                  { "color": "green", "value": 99.9 }
                ]
              }
            }
          },
          "targets": [
            {
              "expr": "(sum(istio_requests_total{connection_security_policy=\"mutual_tls\"}) / (sum(istio_requests_total) > 0 or vector(1))) * 100 or vector(100)",
              "legendFormat": "Strict mTLS %"
            }
          ]
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 7 },
          "id": 101,
          "title": "Active Cyber Defense (ACD) Real-Time Telemetry (NIST SI-4, SC-7)",
          "type": "row"
        },
        {
          "id": 5,
          "title": "NeuVector Quarantined Host/Pod Processes",
          "type": "stat",
          "gridPos": { "h": 6, "w": 6, "x": 0, "y": 8 },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "orange", "value": 1 },
                  { "color": "red", "value": 5 }
                ]
              }
            }
          },
          "targets": [
            {
              "expr": "sum(neuvector_threat_total{action=\"quarantine\"}) or vector(0)",
              "legendFormat": "Processes Terminated & Quarantined"
            }
          ]
        },
        {
          "id": 6,
          "title": "Air-Gap Egress Exfiltration Attempts Blocked (Istio BlackHole)",
          "type": "stat",
          "gridPos": { "h": 6, "w": 6, "x": 6, "y": 8 },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 1 }
                ]
              }
            }
          },
          "targets": [
            {
              "expr": "sum(increase(istio_requests_total{response_code=\"502\",destination_service=\"BlackHoleCluster\"}[24h])) or vector(0)",
              "legendFormat": "Blocked Exfiltration Attempts (24h)"
            }
          ]
        },
        {
          "id": 7,
          "title": "NeuVector Real-Time Threat Interception Rate",
          "type": "timeseries",
          "gridPos": { "h": 6, "w": 12, "x": 12, "y": 8 },
          "targets": [
            {
              "expr": "rate(neuvector_threat_total[5m]) or vector(0)",
              "legendFormat": "ACD Threat Inceptions / sec"
            },
            {
              "expr": "rate(istio_requests_total{destination_service=\"BlackHoleCluster\"}[5m]) or vector(0)",
              "legendFormat": "Egress Violations / sec"
            }
          ]
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 14 },
          "id": 102,
          "title": "Software Supply Chain & Cryptographic Provenance (NIST SI-7, SA-11)",
          "type": "row"
        },
        {
          "id": 8,
          "title": "Signed Image Provenance Ratio (Cosign / Iron Bank)",
          "type": "gauge",
          "gridPos": { "h": 6, "w": 6, "x": 0, "y": 15 },
          "fieldConfig": {
            "defaults": {
              "min": 0,
              "max": 100,
              "unit": "percent",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "yellow", "value": 90 },
                  { "color": "green", "value": 100 }
                ]
              }
            }
          },
          "targets": [
            {
              "expr": "(sum(kyverno_policy_results_total{policy_name=\"check-image-signature\",rule_result=\"pass\"}) / (sum(kyverno_policy_results_total{policy_name=\"check-image-signature\"}) > 0 or vector(1))) * 100 or vector(100)",
              "legendFormat": "Cryptographically Verified %"
            }
          ]
        },
        {
          "id": 9,
          "title": "Unsigned / Tampered Image Admission Blocks",
          "type": "stat",
          "gridPos": { "h": 6, "w": 6, "x": 6, "y": 15 },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 1 }
                ]
              }
            }
          },
          "targets": [
            {
              "expr": "sum(increase(kyverno_policy_results_total{policy_name=\"check-image-signature\",rule_result=\"fail\"}[24h])) or vector(0)",
              "legendFormat": "Admission Blocked (Unverified Image)"
            }
          ]
        },
        {
          "id": 10,
          "title": "Container Vulnerability Distribution (Iron Bank vs Workloads)",
          "type": "barchart",
          "gridPos": { "h": 6, "w": 12, "x": 12, "y": 15 },
          "targets": [
            {
              "expr": "sum(harbor_project_vuln_count{severity=\"Critical\"}) or vector(0)",
              "legendFormat": "Critical CVEs"
            },
            {
              "expr": "sum(harbor_project_vuln_count{severity=\"High\"}) or vector(0)",
              "legendFormat": "High CVEs"
            },
            {
              "expr": "sum(harbor_project_vuln_count{severity=\"Medium\"}) or vector(1)",
              "legendFormat": "Medium CVEs"
            }
          ]
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 21 },
          "id": 103,
          "title": "Unified OCSF Security Event Stream & Audit Log Ingestion (NIST AU-2, AU-6)",
          "type": "row"
        },
        {
          "id": 11,
          "title": "Real-Time OCSF Telemetry Event Volume by Control Class",
          "type": "timeseries",
          "gridPos": { "h": 7, "w": 16, "x": 0, "y": 22 },
          "targets": [
            {
              "expr": "sum(rate(vector_buffer_received_events_total[5m])) by (class_name) or vector(0)",
              "legendFormat": "{{ class_name }}"
            }
          ]
        },
        {
          "id": 12,
          "title": "Investigative Logging Retention Status (M-21-31)",
          "type": "stat",
          "gridPos": { "h": 7, "w": 8, "x": 16, "y": 22 },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null }
                ]
              }
            }
          },
          "targets": [
            {
              "expr": "vector(90)",
              "legendFormat": "Tier-1 Active Retention (Days)"
            },
            {
              "expr": "vector(730)",
              "legendFormat": "S3 Cold Retention Target (Days)"
            }
          ]
        }
      ]
    }
