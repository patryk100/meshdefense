apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vault-tls-cert
  namespace: vault
spec:
  secretName: vault-tls-cert
  duration: 2160h # 90 days
  renewBefore: 720h # 30 days
  isCA: false
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: meshdefense-cluster-issuer
    kind: ClusterIssuer
    group: cert-manager.io
  dnsNames:
    - "vault.vault.svc.cluster.local"
    - "vault.vault.svc"
    - "vault.apps.poc-minimal.il6.meshdefense.internal"
    - "vault.apps.dev.il6.meshdefense.internal"
    - "vault.apps.test.il6.meshdefense.internal"
    - "vault.apps.stg.il6.meshdefense.internal"
    - "vault.apps.prod.il6.meshdefense.internal"
---
apiVersion: networking.istio.io/v1alpha3
kind: DestinationRule
metadata:
  name: vault-destination-rule
  namespace: vault
spec:
  host: vault.vault.svc.cluster.local
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL # Strict mTLS managed by Istio sidecar
