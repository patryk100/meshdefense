apiVersion: v1
kind: Secret
metadata:
  name: keycloak-db-secret
  namespace: keycloak
type: Opaque
stringData:
  KC_DB_USERNAME: "keycloak_user"
  KC_DB_PASSWORD: "MeshDefenseKeycloakRdsPassword2026!"
  KEYCLOAK_ADMIN: "admin"
  KEYCLOAK_ADMIN_PASSWORD: "MeshDefenseKeycloakAdmin2026!"
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: keycloak-tls-cert
  namespace: keycloak
spec:
  secretName: keycloak-tls-cert
  duration: 2160h # 90 days
  renewBefore: 720h # 30 days
  isCA: false
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: meshdefense-cluster-issuer
    kind: ClusterIssuer
    group: cert-manager.io
  dnsNames:
    - "keycloak.keycloak.svc.cluster.local"
    - "keycloak.keycloak.svc"
    - "keycloak.apps.poc-minimal.il6.meshdefense.internal"
    - "keycloak.apps.dev.il6.meshdefense.internal"
    - "keycloak.apps.test.il6.meshdefense.internal"
    - "keycloak.apps.stg.il6.meshdefense.internal"
    - "keycloak.apps.prod.il6.meshdefense.internal"
---
apiVersion: networking.istio.io/v1alpha3
kind: DestinationRule
metadata:
  name: keycloak-destination-rule
  namespace: keycloak
spec:
  host: keycloak.keycloak.svc.cluster.local
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
