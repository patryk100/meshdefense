apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: rds-postgres-credentials
  namespace: default
  labels:
    app.kubernetes.io/name: postgresql-credentials
    app.kubernetes.io/part-of: meshdefense
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: rds-postgres-credentials
    creationPolicy: Owner
  dataFrom:
  - extract:
      key: meshdefense/poc-minimal/rds/master-credentials-da0v
