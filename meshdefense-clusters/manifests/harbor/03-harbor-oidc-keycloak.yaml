apiVersion: v1
kind: Secret
metadata:
  name: harbor-oidc-keycloak-secret
  namespace: harbor
type: Opaque
stringData:
  secret: "MeshDefenseKeycloakHarborSecret2026!"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: harbor-keycloak-oidc-config
  namespace: harbor
data:
  auth_mode: "oidc_auth"
  oidc_name: "Keycloak SSO"
  oidc_endpoint: "https://keycloak.apps.poc-minimal.il6.meshdefense.internal/auth/realms/baby-yoda"
  oidc_client_id: "harbor-sso"
  oidc_scope: "openid,profile,email,groups"
  oidc_verify_cert: "false"
  oidc_auto_onboard: "true"
  oidc_user_claim: "preferred_username"
  oidc_groups_claim: "groups"
  oidc_admin_group: "platform-administrators"
