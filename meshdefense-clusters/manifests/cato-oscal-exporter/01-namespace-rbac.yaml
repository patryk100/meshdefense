apiVersion: v1
kind: Namespace
metadata:
  name: cato
  labels:
    app.kubernetes.io/name: cato
    istio-injection: enabled
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: oscal-exporter
  namespace: cato
  labels:
    app.kubernetes.io/name: oscal-exporter
    app.kubernetes.io/part-of: cato
  annotations:
    # Uses IRSA Logging role for S3 compliance evidence bucket export
    eks.amazonaws.com/role-arn: arn:${AWS_PARTITION:-aws}:iam::${AWS_ACCOUNT_ID}:role/meshdefense-${ENVIRONMENT}-eks-irsa-logging
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: oscal-exporter-evaluator
  labels:
    app.kubernetes.io/name: oscal-exporter
    app.kubernetes.io/part-of: cato
rules:
  # Kyverno Policy & Admission evaluations
  - apiGroups: ["kyverno.io", "wgpolicyk8s.io"]
    resources:
      - clusterpolicies
      - policies
      - policyreports
      - clusterpolicyreports
    verbs: ["get", "list", "watch"]
  # NeuVector Security Rules & Status
  - apiGroups: ["neuvector.com"]
    resources:
      - nvuserrules
      - nvclustergroups
      - nvgroups
    verbs: ["get", "list", "watch"]
  # Kubernetes core cluster state & CIS Benchmarks
  - apiGroups: [""]
    resources:
      - namespaces
      - nodes
      - pods
      - configmaps
    verbs: ["get", "list"]
  # Compliance artifact publishing inside cluster
  - apiGroups: [""]
    resources:
      - configmaps
    verbs: ["create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: oscal-exporter-evaluator
  labels:
    app.kubernetes.io/name: oscal-exporter
    app.kubernetes.io/part-of: cato
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: oscal-exporter-evaluator
subjects:
  - kind: ServiceAccount
    name: oscal-exporter
    namespace: cato
---
# ==============================================================================
# Zero-Trust Network Policies for cATO Namespace (NIST 800-53 SC-7)
# ==============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cato-default-deny
  namespace: cato
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cato-allow-egress-apiserver-and-s3
  namespace: cato
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    # CoreDNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow communication to internal VPC Endpoints & AWS API (S3 Gateway & KMS)
    - to:
        - ipBlock:
            cidr: 10.104.0.0/16
        - ipBlock:
            cidr: 169.254.169.254/32
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80
