# ==============================================================================
# MeshDefense NeuVector Controller, Manager, and Enforcer DaemonSet (Story 5.2)
# Configured in Protect Mode for Active Cyber Defense (NIST 800-53 SI-4)
# ==============================================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: neuvector-init-config
  namespace: neuvector
  labels:
    app.kubernetes.io/name: neuvector
data:
  neuvector.yaml: |
    # NeuVector Active Cyber Defense Configuration
    # Defaults: Protect Mode, Auto Network Rule Discovery, Quarantine on Violation
    fed_config:
      poll_interval: 60
    system_config:
      # Active Cyber Defense: Start in Discover mode for baseline, auto-advance to Protect
      new_service_policy_mode: "Protect"
      unused_group_aging: 24
      syslog:
        syslog_ip: "10.104.0.10"
        syslog_port: 514
        syslog_level: "Notice"
        syslog_status: true
        syslog_protocol: 1 # UDP
      webhook:
        webhook_status: true
        webhook_url: "http://vector.monitoring.svc.cluster.local:8088/neuvector-alerts"
      quarantine:
        quarantine_action: "Quarantine"
        auto_quarantine_incident: true
---
apiVersion: v1
kind: Service
metadata:
  name: neuvector-service-web
  namespace: neuvector
  labels:
    app.kubernetes.io/name: neuvector
    app.kubernetes.io/component: manager
spec:
  type: ClusterIP
  ports:
    - name: https-web
      port: 8443
      targetPort: 8443
      protocol: TCP
  selector:
    app.kubernetes.io/name: neuvector
    app.kubernetes.io/component: manager
---
apiVersion: v1
kind: Service
metadata:
  name: neuvector-service-controller
  namespace: neuvector
  labels:
    app.kubernetes.io/name: neuvector
    app.kubernetes.io/component: controller
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: cluster-rpc
      port: 18300
      protocol: TCP
    - name: cluster-gossip
      port: 18301
      protocol: TCP
  selector:
    app.kubernetes.io/name: neuvector
    app.kubernetes.io/component: controller
---
# ------------------------------------------------------------------------------
# 1. NeuVector Controller (Active Cyber Defense Brain)
# ------------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: neuvector-controller-pod
  namespace: neuvector
  labels:
    app.kubernetes.io/name: neuvector
    app.kubernetes.io/component: controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: neuvector
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: neuvector
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: neuvector-controller
      containers:
        - name: neuvector-controller-pod
          image: ${REGISTRY_DOMAIN}/ironbank/neuvector/controller:5.3.2
          imagePullPolicy: IfNotPresent
          env:
            - name: CLUSTER_JOIN_ADDR
              value: neuvector-service-controller.neuvector.svc.cluster.local
            - name: CTRL_PERSIST_CONFIG
              value: "1"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
          volumeMounts:
            - name: config-volume
              mountPath: /etc/neuvector/neuvector.yaml
              subPath: neuvector.yaml
      volumes:
        - name: config-volume
          configMap:
            name: neuvector-init-config
---
# ------------------------------------------------------------------------------
# 2. NeuVector Manager (Admin Web Console & Alert Management)
# ------------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: neuvector-manager-pod
  namespace: neuvector
  labels:
    app.kubernetes.io/name: neuvector
    app.kubernetes.io/component: manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: neuvector
      app.kubernetes.io/component: manager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: neuvector
        app.kubernetes.io/component: manager
    spec:
      serviceAccountName: neuvector-manager
      containers:
        - name: neuvector-manager-pod
          image: ${REGISTRY_DOMAIN}/ironbank/neuvector/manager:5.3.2
          imagePullPolicy: IfNotPresent
          env:
            - name: CTRL_SERVER_IP
              value: neuvector-service-controller.neuvector.svc.cluster.local
          ports:
            - name: https-web
              containerPort: 8443
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
# ------------------------------------------------------------------------------
# 3. NeuVector Enforcer DaemonSet (Kernel Network Filter & Process Quarantine)
# ------------------------------------------------------------------------------
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: neuvector-enforcer-pod
  namespace: neuvector
  labels:
    app.kubernetes.io/name: neuvector
    app.kubernetes.io/component: enforcer
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: neuvector
      app.kubernetes.io/component: enforcer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: neuvector
        app.kubernetes.io/component: enforcer
    spec:
      hostPID: true
      hostNetwork: true
      serviceAccountName: neuvector-enforcer
      tolerations:
        - effect: NoSchedule
          key: node-role.kubernetes.io/master
          operator: Exists
        - effect: NoSchedule
          key: node-role.kubernetes.io/control-plane
          operator: Exists
      containers:
        - name: neuvector-enforcer-pod
          image: ${REGISTRY_DOMAIN}/ironbank/neuvector/enforcer:5.3.2
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
            capabilities:
              add:
                - SYS_ADMIN
                - NET_ADMIN
                - SYS_PTRACE
                - IPC_LOCK
          env:
            - name: CLUSTER_JOIN_ADDR
              value: neuvector-service-controller.neuvector.svc.cluster.local
            - name: NV_SYSTEM_DRV_MODE
              value: "ebpf"
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: 800m
              memory: 1Gi
          volumeMounts:
            - mountPath: /var/run/containerd/containerd.sock
              name: runtime-sock
              readOnly: true
            - mountPath: /host/proc
              name: proc-vol
              readOnly: true
            - mountPath: /host/cgroup
              name: cgroup-vol
              readOnly: true
            - mountPath: /lib/modules
              name: modules-vol
              readOnly: true
      volumes:
        - name: runtime-sock
          hostPath:
            path: /run/containerd/containerd.sock
        - name: proc-vol
          hostPath:
            path: /proc
        - name: cgroup-vol
          hostPath:
            path: /sys/fs/cgroup
        - name: modules-vol
          hostPath:
            path: /lib/modules
