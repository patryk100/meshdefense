apiVersion: v1
kind: Namespace
metadata:
  name: neuvector
  labels:
    app.kubernetes.io/name: neuvector
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: neuvector-controller
  namespace: neuvector
  labels:
    app.kubernetes.io/name: neuvector
    app.kubernetes.io/component: controller
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: neuvector-enforcer
  namespace: neuvector
  labels:
    app.kubernetes.io/name: neuvector
    app.kubernetes.io/component: enforcer
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: neuvector-manager
  namespace: neuvector
  labels:
    app.kubernetes.io/name: neuvector
    app.kubernetes.io/component: manager
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: neuvector-binding-app
  labels:
    app.kubernetes.io/name: neuvector
rules:
  - apiGroups:
      - ""
    resources:
      - nodes
      - pods
      - services
      - namespaces
      - replicationcontrollers
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - apps
    resources:
      - deployments
      - daemonsets
      - statefulsets
      - replicasets
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - batch
    resources:
      - jobs
      - cronjobs
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - neuvector.com
    resources:
      - nvsecurityrules
      - nvclustersecurityrules
      - nvadmissioncontrolsecurityrules
      - nvvulnerabilityprofiles
      - nvcomplianceprofiles
      - nvgroupdefinitions
      - nvresponserulesecurityrules
      - nvwafsecurityrules
      - nvdlpsecurityrules
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - delete
      - patch
  - apiGroups:
      - admissionregistration.k8s.io
    resources:
      - validatingwebhookconfigurations
      - mutatingwebhookconfigurations
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: neuvector-binding-app
  labels:
    app.kubernetes.io/name: neuvector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: neuvector-binding-app
subjects:
  - kind: ServiceAccount
    name: neuvector-controller
    namespace: neuvector
  - kind: ServiceAccount
    name: neuvector-enforcer
    namespace: neuvector
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: neuvector-active-defense-isolation
  namespace: neuvector
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow intra-namespace communication between manager, controller, enforcers
    - from:
        - podSelector: {}
    # Allow REST API / Web UI traffic from Istio Ingress Gateway
    - from:
        - namespaceSelector:
            matchLabels:
              istio.io/deploystatus: "gateway"
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
      ports:
        - protocol: TCP
          port: 8443
    # Allow Prometheus metrics scraping
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8080
  egress:
    # Allow DNS resolution
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow internal communication
    - to:
        - podSelector: {}
    # Allow API server access
    - to:
        - ipBlock:
            cidr: 10.104.0.0/16
      ports:
        - protocol: TCP
          port: 443
    # Allow Syslog / SIEM telemetry export
    - to:
        - ipBlock:
            cidr: 10.104.0.0/16
      ports:
        - protocol: UDP
          port: 514
        - protocol: TCP
          port: 514
        - protocol: TCP
          port: 6514
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: neuvector-manager-tls
  namespace: istio-system
spec:
  secretName: neuvector-manager-tls
  duration: 2160h # 90 days
  renewBefore: 720h # 30 days
  isCA: false
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: meshdefense-cluster-issuer
    kind: ClusterIssuer
    group: cert-manager.io
  dnsNames:
    - neuvector.apps.poc-minimal.il6.meshdefense.internal
    - neuvector.apps.dev.il6.meshdefense.internal
    - neuvector.apps.test.il6.meshdefense.internal
    - neuvector.apps.stg.il6.meshdefense.internal
    - neuvector.apps.prod.il6.meshdefense.internal
---
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: neuvector-vs
  namespace: istio-system
spec:
  hosts:
    - "neuvector.apps.poc-minimal.il6.meshdefense.internal"
    - "neuvector.apps.dev.il6.meshdefense.internal"
    - "neuvector.apps.test.il6.meshdefense.internal"
    - "neuvector.apps.stg.il6.meshdefense.internal"
    - "neuvector.apps.prod.il6.meshdefense.internal"
  gateways:
    - meshdefense-internal-gateway
  http:
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: neuvector-service-web.neuvector.svc.cluster.local
            port:
              number: 8443
