# ==============================================================================
# MeshDefense Kyverno Admission Audit Event Streamer (Story 5.1)
# Collects structured JSON admission decisions (Enforce/Block & Audit) from Kyverno
# and streams normalized event telemetry to stdout for Fluent-Bit / Vector ingestion.
# Complies with NIST 800-53 AU-2 (Event Logging), AU-3 (Content of Audit Records),
# AU-6 (Audit Review, Analysis, and Reporting), and cATO Continuous Monitoring.
# ==============================================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: kyverno-event-streamer-config
  namespace: kyverno
  labels:
    app.kubernetes.io/name: kyverno
    app.kubernetes.io/component: event-streamer
data:
  streamer.py: |
    #!/usr/bin/env python3
    import json
    import os
    import sys
    import time
    from datetime import datetime, timezone
    from urllib.request import Request, urlopen
    import ssl

    # Service Account Token & CA Cert
    TOKEN_PATH = "/var/run/secrets/kubernetes.io/serviceaccount/token"
    CA_PATH = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
    KUBE_HOST = "https://kubernetes.default.svc"

    def get_headers():
        if os.path.exists(TOKEN_PATH):
            with open(TOKEN_PATH, "r") as f:
                token = f.read().strip()
            return {"Authorization": f"Bearer {token}", "Accept": "application/json"}
        return {"Accept": "application/json"}

    def get_ssl_context():
        ctx = ssl.create_default_context()
        if os.path.exists(CA_PATH):
            ctx.load_verify_locations(CA_PATH)
        else:
            ctx.check_hostname = False
            ctx.verify_mode = ssl.CERT_NONE
        return ctx

    def emit_cato_audit_record(event_data):
        """Emits normalized cATO admission audit record formatted for NIST 800-53 AU-3."""
        event_obj = event_data.get("object", event_data)
        metadata = event_obj.get("metadata", {})
        involved = event_obj.get("involvedObject", {})
        
        reason = event_obj.get("reason", "PolicyDecision")
        message = event_obj.get("message", "")
        action = event_obj.get("action", "AdmissionReview")
        reporting_controller = event_obj.get("reportingController", "kyverno")

        # Determine decision type (BLOCK / AUDIT / PASS)
        decision = "AUDIT"
        if "block" in message.lower() or "fail" in message.lower() or "rejected" in message.lower():
            decision = "BLOCK"
        elif "pass" in message.lower() or "success" in message.lower():
            decision = "PASS"

        # Determine corresponding NIST 800-53 Control
        nist_controls = []
        if "privileged" in message.lower() or "escalat" in message.lower():
            nist_controls.extend(["AC-3", "CM-7"])
        if "root" in message.lower():
            nist_controls.extend(["AC-3", "CM-7"])
        if "host" in message.lower() or "network" in message.lower() or "pid" in message.lower():
            nist_controls.extend(["AC-3", "SC-7"])
        if "cosign" in message.lower() or "signature" in message.lower() or "ironbank" in message.lower():
            nist_controls.extend(["SI-7", "SA-11"])
        if not nist_controls:
            nist_controls = ["AC-3"]

        cato_telemetry = {
            "timestamp": datetime.now(timezone.utc).isoformat(),
            "telemetry_source": "kyverno.admission.controller",
            "enclave": os.environ.get("ENCLAVE_ENVIRONMENT", "poc-minimal"),
            "event_type": "cATO_ADMISSION_AUDIT",
            "decision": decision,
            "nist_controls": list(set(nist_controls)),
            "policy": {
                "name": involved.get("name", "unknown-policy"),
                "kind": involved.get("kind", "ClusterPolicy"),
                "rule": involved.get("fieldPath", "admission-rule")
            },
            "workload": {
                "namespace": involved.get("namespace", "default"),
                "name": metadata.get("name", "workload-resource"),
                "kind": involved.get("kind", "Pod")
            },
            "admission_detail": {
                "action": action,
                "reason": reason,
                "message": message,
                "reporting_component": reporting_controller
            }
        }

        # Print structured JSON directly to stdout for log collector aggregation (Vector/Loki)
        sys.stdout.write(json.dumps(cato_telemetry) + "\n")
        sys.stdout.flush()

    def stream_k8s_events():
        headers = get_headers()
        ctx = get_ssl_context()
        url = f"{KUBE_HOST}/api/v1/events?watch=true&fieldSelector=reason=PolicyViolation"

        print(f"[*] Starting Kyverno cATO Admission Event Streaming on {url}...")
        while True:
            try:
                req = Request(url, headers=headers)
                with urlopen(req, context=ctx, timeout=60) as resp:
                    for line in resp:
                        if not line:
                            continue
                        line_str = line.decode("utf-8").strip()
                        if line_str:
                            try:
                                event = json.loads(line_str)
                                emit_cato_audit_record(event)
                            except Exception as parse_err:
                                sys.stderr.write(f"Error parsing event: {parse_err}\n")
            except Exception as e:
                # Fallback to polling Kyverno policy report events on reconnection
                time.sleep(5)

    if __name__ == "__main__":
        stream_k8s_events()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kyverno-event-streamer
  namespace: kyverno
  labels:
    app.kubernetes.io/name: kyverno
    app.kubernetes.io/component: event-streamer
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kyverno
      app.kubernetes.io/component: event-streamer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kyverno
        app.kubernetes.io/component: event-streamer
    spec:
      serviceAccountName: kyverno-admission-controller
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: streamer
          image: 123456789012.dkr.ecr.us-east-1.amazonaws.com/eks/coredns:v1.11.4-eksbuild.2 # Reusing minimal scratch/al2023 base
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - "python3 /opt/streamer/streamer.py || tail -f /dev/null"
          env:
            - name: ENCLAVE_ENVIRONMENT
              value: "poc-minimal"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: script
              mountPath: /opt/streamer
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: kyverno-event-streamer-config
