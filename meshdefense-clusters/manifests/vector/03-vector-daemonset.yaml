# ==============================================================================
# Vector DaemonSet Telemetry Shipper (Story 5.4)
# Runs across all enclave nodes, mounting /var/log/pods and /var/lib/docker/containers
# Equipped with IRSA Logging role for direct AWS S3 / CloudWatch / Loki streaming
# ==============================================================================
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: vector
  namespace: logging
  labels:
    app.kubernetes.io/name: vector
    app.kubernetes.io/part-of: logging
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: vector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vector
        app.kubernetes.io/part-of: logging
    spec:
      serviceAccountName: vector
      terminationGracePeriodSeconds: 60
      tolerations:
        - operator: Exists
          effect: NoSchedule
        - operator: Exists
          effect: NoExecute
      securityContext:
        runAsUser: 0
        runAsNonRoot: false
      containers:
        - name: vector
          image: 123456789012.dkr.ecr.us-east-1.amazonaws.com/timberio/vector:0.38.0-distroless-libc
          imagePullPolicy: IfNotPresent
          args:
            - --config
            - /etc/vector/vector.yaml
          env:
            - name: VECTOR_LOG
              value: "info"
            - name: VECTOR_SELF_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: AWS_REGION
              value: "us-east-1"
          ports:
            - name: syslog
              containerPort: 514
              protocol: TCP
            - name: webhook
              containerPort: 8088
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          volumeMounts:
            - name: config
              mountPath: /etc/vector
              readOnly: true
            - name: data
              mountPath: /var/lib/vector
            - name: var-log
              mountPath: /var/log
              readOnly: true
            - name: var-lib
              mountPath: /var/lib/docker/containers
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: vector-config
        - name: data
          hostPath:
            path: /var/lib/vector
            type: DirectoryOrCreate
        - name: var-log
          hostPath:
            path: /var/log
            type: Directory
        - name: var-lib
          hostPath:
            path: /var/lib/docker/containers
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: vector
  namespace: logging
  labels:
    app.kubernetes.io/name: vector
    app.kubernetes.io/part-of: logging
spec:
  type: ClusterIP
  ports:
    - name: syslog
      port: 514
      targetPort: 514
      protocol: TCP
    - name: webhook
      port: 8088
      targetPort: 8088
      protocol: TCP
  selector:
    app.kubernetes.io/name: vector
