apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: meshdefense-selfsigned-bootstrap-issuer
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: meshdefense-root-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: "MeshDefense Air-Gap Root CA"
  secretName: meshdefense-root-ca-key-pair
  duration: 87600h # 10 years
  renewBefore: 8760h # 1 year
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: meshdefense-selfsigned-bootstrap-issuer
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: meshdefense-root-ca-issuer
spec:
  ca:
    secretName: meshdefense-root-ca-key-pair
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: meshdefense-intermediate-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: "MeshDefense Intermediate CA - Workloads & Ingress"
  secretName: meshdefense-intermediate-ca-key-pair
  duration: 43800h # 5 years
  renewBefore: 4380h # 6 months
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: meshdefense-root-ca-issuer
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: meshdefense-cluster-issuer
spec:
  ca:
    secretName: meshdefense-intermediate-ca-key-pair
