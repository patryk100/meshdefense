apiVersion: velero.io/v1
kind: BackupStorageLocation
metadata:
  name: default
  namespace: velero
  labels:
    app.kubernetes.io/name: velero
    app.kubernetes.io/part-of: meshdefense-backup-dr
spec:
  provider: aws
  objectStorage:
    bucket: meshdefense-${ENVIRONMENT}-velero-backups
    prefix: backups
  config:
    region: ${AWS_REGION}
    kmsKeyId: "arn:${AWS_PARTITION:-aws}:kms:${AWS_REGION}:${AWS_ACCOUNT_ID}:alias/meshdefense-${ENVIRONMENT}-s3"
    serverSideEncryption: aws:kms
---
apiVersion: velero.io/v1
kind: VolumeSnapshotLocation
metadata:
  name: default
  namespace: velero
  labels:
    app.kubernetes.io/name: velero
    app.kubernetes.io/part-of: meshdefense-backup-dr
spec:
  provider: aws
  config:
    region: ${AWS_REGION}
