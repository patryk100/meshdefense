apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: harbor
  namespace: harbor
spec:
  hosts:
    - "harbor.127.0.0.1.nip.io"
  gateways:
    - istio-gateway/public-ingressgateway
  http:
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: harbor.harbor.svc.cluster.local
            port:
              number: 80
