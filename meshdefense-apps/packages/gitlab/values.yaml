# ==============================================================================
# GitLab Enterprise / Community Helm Values for Air-Gapped Big Bang
# ==============================================================================

global:
  hosts:
    domain: "il6.meshdefense.internal"
    hostSuffix: ""
  image:
    registry: "registry.il6.meshdefense.internal"
    repository: "ironbank/gitlab/gitlab-ee"
    tag: "v16.8.1-ee"
    pullSecrets:
      - name: "harbor-registry-secret"
  ingress:
    enabled: true
    configureCertmanager: false
    annotations:
      kubernetes.io/ingress.class: "istio"
      cert-manager.io/cluster-issuer: "meshdefense-ca-issuer"

# Disable outbound telemetry and external dependencies
gitlab:
  telemetry:
    enabled: false
  usagePing:
    enabled: false

# Air-gapped GitLab Runner configuration
gitlab-runner:
  install: true
  image: "registry.il6.meshdefense.internal/ironbank/gitlab/gitlab-runner:v16.8.0"
  runners:
    privileged: false
    cloneURL: "https://gitlab.il6.meshdefense.internal"
    image: "registry.il6.meshdefense.internal/ironbank/redhat/ubi/ubi9:latest"
