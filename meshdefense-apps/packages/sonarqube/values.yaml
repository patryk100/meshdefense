# ==============================================================================
# SonarQube Helm Values for Air-Gapped Big Bang
# ==============================================================================

image:
  repository: "registry.il6.meshdefense.internal/ironbank/sonarsource/sonarqube"
  tag: "10.5.1-community"
  pullSecrets:
    - name: "harbor-registry-secret"

community:
  enabled: true

# Database: internal PostgreSQL (hardened Iron Bank image)
postgresql:
  enabled: true
  image:
    repository: "registry.il6.meshdefense.internal/ironbank/opensource/postgres/postgresql"
    tag: "16.2"

# Security & Istio integration
securityContext:
  fsGroup: 1000
  runAsUser: 1000
  runAsNonRoot: true

ingress:
  enabled: false # Routed via Istio VirtualService in Big Bang
