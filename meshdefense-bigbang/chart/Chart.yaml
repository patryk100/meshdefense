apiVersion: v2
name: bigbang
description: Platform One Big Bang Helm umbrella chart mirrored and packaged for air-gapped DoD IL6 enclaves.
type: application
version: 3.30.0
appVersion: "3.30.0"
icon: https://repo1.dso.mil/assets/favicon-7951a1a59626c19c177772d9f1b63395.png
maintainers:
  - name: MeshDefense Platform Engineering
    email: devsecops@meshdefense.internal
keywords:
  - platform-one
  - bigbang
  - devsecops
  - airgap
  - il6
  - istio
  - ironbank
dependencies:
  - name: istio
    version: "1.22.1"
    repository: "file://charts/istio"
    condition: istio.enabled
  - name: gatekeeper
    version: "3.16.1"
    repository: "file://charts/gatekeeper"
    condition: gatekeeper.enabled
  - name: monitoring
    version: "60.0.0"
    repository: "file://charts/monitoring"
    condition: monitoring.enabled
  - name: neuvector
    version: "5.3.2"
    repository: "file://charts/neuvector"
    condition: neuvector.enabled
  - name: fluentbit
    version: "0.46.0"
    repository: "file://charts/fluentbit"
    condition: fluentbit.enabled
